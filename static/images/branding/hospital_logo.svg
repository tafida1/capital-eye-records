<svg viewBox="0 0 760 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hospital-logo-title">
  <title id="hospital-logo-title">Capital Eye Hospital</title>

  <defs>
    <linearGradient id="markBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5AA9E6"/>
      <stop offset="55%" stop-color="#2E78C7"/>
      <stop offset="100%" stop-color="#1B4F8A"/>
    </linearGradient>

    <linearGradient id="irisGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9FD4FF"/>
      <stop offset="100%" stop-color="#3C8AD1"/>
    </linearGradient>

    <radialGradient id="pupilGlow" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1B3A56"/>
      <stop offset="100%" stop-color="#0A1828"/>
    </radialGradient>

    <linearGradient id="shineGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Mark: rounded-square eye badge -->
  <g transform="translate(10,10)">
    <rect x="0" y="0" width="200" height="200" rx="46" fill="url(#markBg)"/>
    <path d="M0 54 Q100 4 200 54 L200 90 Q100 36 0 90 Z" fill="url(#shineGradient)"/>

    <g transform="translate(100,100)">
      <path d="M-68 0
               C -48 -38, -22 -54, 0 -54
               C 22 -54, 48 -38, 68 0
               C 48 38, 22 54, 0 54
               C -22 54, -48 38, -68 0 Z"
            fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="35" fill="url(#irisGradient)"/>
      <circle cx="0" cy="0" r="35" fill="none" stroke="#1B4F8A" stroke-width="1.5" opacity="0.25"/>
      <circle cx="0" cy="0" r="27" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.35"/>
      <circle cx="0" cy="0" r="16" fill="url(#pupilGlow)"/>
      <circle cx="-6" cy="-7" r="5.5" fill="#FFFFFF" opacity="0.95"/>
      <circle cx="8" cy="6" r="2.4" fill="#FFFFFF" opacity="0.5"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(240,0)">
    <text x="0" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#1B4F8A">
      CAPITAL EYE
    </text>
    <text x="0" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#1B4F8A">
      HOSPITAL
    </text>

    <!-- Divider line -->
    <rect x="2" y="166" width="280" height="4" rx="2" fill="#3C8AD1"/>

    <text x="2" y="196" font-family="Arial, sans-serif" font-size="22" letter-spacing="2" fill="#5A7A99">
      SMART HOSPITAL RECORDS SYSTEM
    </text>
  </g>
</svg>
