<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="favicon-title">
  <title id="favicon-title">Capital Eye Hospital</title>

  <defs>
    <linearGradient id="favEyeGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5AA9E6"/>
      <stop offset="100%" stop-color="#2566A8"/>
    </linearGradient>
  </defs>

  <!-- Background circle for contrast at small sizes -->
  <circle cx="32" cy="32" r="32" fill="#FFFFFF"/>

  <!-- Almond eye shape, bold and simplified -->
  <path d="M4 32
           C 12 16, 22 8, 32 8
           C 42 8, 52 16, 60 32
           C 52 48, 42 56, 32 56
           C 22 56, 12 48, 4 32 Z"
        fill="url(#favEyeGradient)"/>

  <!-- Pupil with white highlight, sized to stay legible at 16px -->
  <circle cx="32" cy="32" r="13" fill="#0F2238"/>
  <circle cx="28" cy="28" r="4.5" fill="#FFFFFF"/>
</svg>
