<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hospital-icon-title">
  <title id="hospital-icon-title">Capital Eye Hospital Icon</title>

  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5AA9E6"/>
      <stop offset="55%" stop-color="#2E78C7"/>
      <stop offset="100%" stop-color="#1B4F8A"/>
    </linearGradient>

    <linearGradient id="eyeGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9FD4FF"/>
      <stop offset="100%" stop-color="#3C8AD1"/>
    </linearGradient>

    <radialGradient id="pupilGlow" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1B3A56"/>
      <stop offset="100%" stop-color="#0A1828"/>
    </radialGradient>

    <linearGradient id="shineGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B2E55" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded square app-icon background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGradient)" filter="url(#softShadow)"/>

  <!-- Top glossy highlight -->
  <path d="M16 124 Q256 16 496 124 L496 200 Q256 80 16 200 Z" fill="url(#shineGradient)" />

  <!-- Medical cross, subtle, behind the eye -->
  <g opacity="0.16">
    <rect x="236" y="120" width="40" height="272" rx="14" fill="#FFFFFF"/>
    <rect x="120" y="236" width="272" height="40" rx="14" fill="#FFFFFF"/>
  </g>

  <!-- Eye mark, centered -->
  <g transform="translate(256,256)">
    <!-- Almond eye outline -->
    <path d="M-168 0
             C -118 -92, -54 -130, 0 -130
             C 54 -130, 118 -92, 168 0
             C 118 92, 54 130, 0 130
             C -54 130, -118 92, -168 0 Z"
          fill="#FFFFFF"/>

    <!-- Iris -->
    <circle cx="0" cy="0" r="86" fill="url(#eyeGradient)"/>
    <circle cx="0" cy="0" r="86" fill="none" stroke="#1B4F8A" stroke-width="3" opacity="0.25"/>
    <circle cx="0" cy="0" r="66" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.35"/>

    <!-- Pupil -->
    <circle cx="0" cy="0" r="40" fill="url(#pupilGlow)"/>

    <!-- Highlights -->
    <circle cx="-15" cy="-18" r="14" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="20" cy="14" r="6" fill="#FFFFFF" opacity="0.5"/>
  </g>
</svg>
