<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="medical-pattern-title">
  <title id="medical-pattern-title">Capital Eye Hospital background pattern</title>

  <defs>
    <pattern id="medTile" width="200" height="200" patternUnits="userSpaceOnUse">

      <!-- Tile background (flat, no gradient, to avoid visible tile seams) -->
      <rect x="0" y="0" width="200" height="200" fill="#EEF4FA"/>

      <!-- Small eye motif, top-left cell -->
      <g transform="translate(40,40)" opacity="0.10">
        <path d="M-22 0 C -14 -13, -6 -18, 0 -18 C 6 -18, 14 -13, 22 0 C 14 13, 6 18, 0 18 C -6 18, -14 13, -22 0 Z" fill="#2E78C7"/>
        <circle cx="0" cy="0" r="7" fill="#FFFFFF"/>
        <circle cx="0" cy="0" r="3.2" fill="#2E78C7"/>
      </g>

      <!-- Medical cross motif, opposite corner -->
      <g transform="translate(150,140)" opacity="0.08">
        <rect x="-3" y="-16" width="6" height="32" rx="3" fill="#2E78C7"/>
        <rect x="-16" y="-3" width="32" height="6" rx="3" fill="#2E78C7"/>
      </g>

      <!-- Small plus/dot accents for rhythm -->
      <circle cx="150" cy="40" r="3.5" fill="#5AA9E6" opacity="0.16"/>
      <circle cx="40" cy="150" r="3.5" fill="#5AA9E6" opacity="0.16"/>

      <!-- Faint heartbeat / pulse line, designed to repeat flush at x=0 and x=200 -->
      <path d="M0 100 L25 100 L40 70 L55 130 L70 100 L200 100"
            fill="none" stroke="#2E78C7" stroke-width="2" opacity="0.07" stroke-linecap="round" stroke-linejoin="round"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="800" height="800" fill="url(#medTile)"/>
</svg>
