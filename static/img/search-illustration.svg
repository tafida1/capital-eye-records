<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="search-illustration-title">
  <title id="search-illustration-title">Search records</title>

  <defs>
    <linearGradient id="floorGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EEF3F8"/>
      <stop offset="100%" stop-color="#E3EAF2"/>
    </linearGradient>

    <linearGradient id="lensGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5AA9E6"/>
      <stop offset="100%" stop-color="#2E5FA3"/>
    </linearGradient>

    <linearGradient id="ringGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3C8AD1"/>
      <stop offset="100%" stop-color="#2566A8"/>
    </linearGradient>

    <linearGradient id="cardGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F6F9FC"/>
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="240" cy="304" rx="140" ry="13" fill="url(#floorGradient)"/>

  <!-- Soft decorative dots -->
  <circle cx="95" cy="80" r="5" fill="#CFE0F0"/>
  <circle cx="395" cy="225" r="6" fill="#CFE0F0"/>
  <circle cx="370" cy="85" r="4" fill="#DCE9F5"/>
  <circle cx="100" cy="240" r="4" fill="#DCE9F5"/>

  <!-- Scattered record cards behind the magnifier -->
  <g transform="translate(95,140) rotate(-8)">
    <rect x="0" y="0" width="120" height="84" rx="10" fill="url(#cardGradient)" stroke="#D7E1EC" stroke-width="2"/>
    <rect x="16" y="20" width="70" height="8" rx="4" fill="#E3EAF2"/>
    <rect x="16" y="38" width="88" height="8" rx="4" fill="#E3EAF2"/>
    <rect x="16" y="56" width="55" height="8" rx="4" fill="#E3EAF2"/>
  </g>

  <g transform="translate(270,165) rotate(7)">
    <rect x="0" y="0" width="120" height="84" rx="10" fill="url(#cardGradient)" stroke="#D7E1EC" stroke-width="2"/>
    <rect x="16" y="20" width="80" height="8" rx="4" fill="#E3EAF2"/>
    <rect x="16" y="38" width="60" height="8" rx="4" fill="#E3EAF2"/>
    <rect x="16" y="56" width="90" height="8" rx="4" fill="#E3EAF2"/>
  </g>

  <!-- Magnifying glass, large and centered -->
  <g transform="translate(240,168)">
    <circle cx="0" cy="0" r="78" fill="#FFFFFF" stroke="url(#ringGradient)" stroke-width="14"/>

    <!-- inner ring detail -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="#CFE0F0" stroke-width="2"/>

    <!-- stylised eye motif inside the lens -->
    <path d="M-44 0 C -26 -30, 26 -30, 44 0 C 26 30, -26 30, -44 0 Z"
          fill="none" stroke="url(#lensGradient)" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="16" fill="url(#lensGradient)"/>
    <circle cx="-4" cy="-4" r="5" fill="#FFFFFF" opacity="0.9"/>

    <!-- handle -->
    <rect x="52" y="52" width="22" height="92" rx="11" fill="url(#ringGradient)" transform="rotate(45 63 98)"/>
  </g>

  <!-- Question mark badge -->
  <g transform="translate(355,255)">
    <circle cx="0" cy="0" r="17" fill="#FFFFFF" stroke="#CFE0F0" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#9FB7D1">?</text>
  </g>
</svg>
