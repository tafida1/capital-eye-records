<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="empty-patients-title">
  <title id="empty-patients-title">No patients found</title>

  <defs>
    <linearGradient id="floorGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EEF3F8"/>
      <stop offset="100%" stop-color="#E3EAF2"/>
    </linearGradient>

    <linearGradient id="irisGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5AA9E6"/>
      <stop offset="100%" stop-color="#2E5FA3"/>
    </linearGradient>

    <linearGradient id="lidGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3C8AD1"/>
      <stop offset="100%" stop-color="#2566A8"/>
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="240" cy="300" rx="130" ry="13" fill="url(#floorGradient)"/>

  <!-- Soft decorative dots -->
  <circle cx="90" cy="80" r="5" fill="#CFE0F0"/>
  <circle cx="395" cy="230" r="6" fill="#CFE0F0"/>
  <circle cx="370" cy="90" r="4" fill="#DCE9F5"/>
  <circle cx="95" cy="245" r="4" fill="#DCE9F5"/>

  <!-- Eye logo, large and centered -->
  <g transform="translate(240,180)">

    <!-- Almond eye shape (outer outline) -->
    <path d="M-150 0
             C -100 -85, -40 -118, 0 -118
             C 40 -118, 100 -85, 150 0
             C 100 85, 40 118, 0 118
             C -40 118, -100 85, -150 0 Z"
          fill="#FFFFFF" stroke="url(#lidGradient)" stroke-width="10" stroke-linejoin="round"/>

    <!-- Upper lid accent -->
    <path d="M-150 0 C -100 -85, -40 -118, 0 -118 C 40 -118, 100 -85, 150 0"
          fill="none" stroke="#1F5A93" stroke-width="4" stroke-linecap="round" opacity="0.25"/>

    <!-- Iris -->
    <circle cx="0" cy="0" r="62" fill="url(#irisGradient)"/>

    <!-- Iris detail rings -->
    <circle cx="0" cy="0" r="62" fill="none" stroke="#1F5A93" stroke-width="2" opacity="0.35"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.25"/>

    <!-- Pupil -->
    <circle cx="0" cy="0" r="26" fill="#16263A"/>

    <!-- Light reflections -->
    <circle cx="-10" cy="-12" r="9" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="14" cy="10" r="4" fill="#FFFFFF" opacity="0.55"/>

    <!-- Lower lash hint -->
    <path d="M-120 30 C -90 65, -40 95, 0 95 C 40 95, 90 65, 120 30"
          fill="none" stroke="#1F5A93" stroke-width="3" stroke-linecap="round" opacity="0.18"/>
  </g>

  <!-- Question mark badge -->
  <g transform="translate(355,90)">
    <circle cx="0" cy="0" r="17" fill="#FFFFFF" stroke="#CFE0F0" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#9FB7D1">?</text>
  </g>
</svg>
