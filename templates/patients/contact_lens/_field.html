<div class="mb-3"
     data-contact-lens-field-wrapper>

    {% if field.field.widget.input_type == "checkbox" %}

        <div class="form-check">

            {{ field }}

            <label class="form-check-label"
                   for="{{ field.id_for_label }}">
                {{ field.label }}
            </label>

        </div>

    {% else %}

        <label class="form-label"
               for="{{ field.id_for_label }}">

            {{ field.label }}

            {% if field.field.required %}
                <span class="text-danger">*</span>
            {% endif %}

        </label>

        {{ field }}

    {% endif %}


    {% if field.help_text %}

        <small class="contact-lens-field-help">
            {{ field.help_text }}
        </small>

    {% endif %}


    {% for error in field.errors %}

        <div class="contact-lens-error">
            {{ error }}
        </div>

    {% endfor %}

</div>
