{% extends "admin/base_site.html" %}
{% load static %}

{% block branding %}
<div id="site-name">
    <a href="{% url 'admin:index' %}">
        CAPITAL EYE HOSPITAL RECORDS SYSTEM
    </a>
    <div style="font-size:12px; font-weight:400; color:#d9f8ff;">
        Enterprise Administration • Developed by Mutafs Global Technology
    </div>
</div>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
    :root {
        --primary: #0B4F8A;
        --secondary: #00A6A6;
        --accent: #F39C12;
        --primary-fg: #ffffff;
        --body-bg: #f4f8fb;
        --body-fg: #1f2937;
    }

    #header {
        background: linear-gradient(135deg, #073B63, #0B4F8A, #00A6A6);
        color: #ffffff;
        min-height: 60px;
    }

    #branding h1,
    #branding h1 a:link,
    #branding h1 a:visited,
    #site-name a {
        color: #ffffff !important;
        font-weight: 900;
        text-decoration: none;
    }

    div.breadcrumbs {
        background: #062f50;
        color: #ffffff;
    }

    .module h2,
    .module caption,
    .inline-group h2 {
        background: #0B4F8A;
        color: #ffffff;
        font-weight: 700;
    }

    a:link,
    a:visited {
        color: #0B4F8A;
    }

    .button,
    input[type=submit],
    input[type=button],
    .submit-row input,
    a.button {
        background: #0B4F8A;
        border-radius: 6px;
    }

    .button:hover,
    input[type=submit]:hover,
    input[type=button]:hover,
    .submit-row input:hover,
    a.button:hover {
        background: #00A6A6;
    }

    .button.default,
    input[type=submit].default,
    .submit-row input.default {
        background: #00A6A6;
    }

    #footer {
        padding: 15px;
        text-align: center;
        color: #5b6770;
        font-size: 12px;
    }

    #footer::after {
        content: "CAPITAL EYE HOSPITAL RECORDS SYSTEM • Developed by Mutafs Global Technology • © {% now 'Y' %} All Rights Reserved";
    }
</style>
{% endblock %}
